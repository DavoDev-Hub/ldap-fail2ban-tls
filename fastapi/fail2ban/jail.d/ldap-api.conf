[ldap-api-http-flood]
enabled  = true
filter   = http-flood
logpath  = /var/log/ldap-api/access.log
# Valores de ejemplo: los reales se afinan con el script de carga del repo
# ddos-load-test (ver su README) y se documentan ahí.
maxretry = 50
findtime = 10
bantime  = 600
action   = iptables-multiport[name=ldap-api-http, port="8000", protocol=tcp]
